<section class="chatbot">

  <header class="chatbot-header">

    <app-bot-avatar
      [state]="avatarState"
    />

    <div>

      <h1>
        Asistente Institucional
      </h1>

      <p>
        ISFD Ituzaingó
      </p>

    </div>

  </header>

  <main class="chat-messages">

    @for (
      message of messages;
      track message.id
    ) {

      <app-chat-message
        [message]="message"
      />

    }

    @if (isLoading) {

      <div class="chat-thinking">

        <app-bot-avatar
          state="thinking"
        />

        <div class="thinking-bubble">
          Consultando la información institucional...
        </div>

      </div>

    }

  </main>

  <app-chat-input
  [disabled]="isLoading"
  (sendMessage)="handleSendMessage($event)"
/>

</section>
