@if (sources.length > 0) {

  <section
    class="sources"
    aria-label="Fuentes consultadas"
  >

    <div class="sources-header">

      <span class="sources-icon">
        📚
      </span>

      <p class="sources-title">
        Fuentes consultadas
      </p>

    </div>

    <div class="sources-list">

      @for (
        source of sources;
        track source.chunkId
      ) {

        <article class="source-card">

          <strong class="source-document">
            {{ source.document }}
          </strong>

          <div class="source-metadata">

            @if (source.resolution) {

              <span class="source-item">
                {{ source.resolution }}
              </span>

            }

            @if (source.article !== null) {

              <span class="source-item source-article">
                Artículo {{ source.article }}
              </span>

            }

            @if (source.section) {

              <span class="source-item">
                Sección: {{ source.section }}
              </span>

            }

          </div>

        </article>

      }

    </div>

  </section>

}
