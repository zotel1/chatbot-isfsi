<div
  class="message-row"
  [class.user]="message.role === 'user'"
  [class.assistant]="message.role === 'assistant'"
>

  @if (message.role === 'assistant') {

    <app-bot-avatar
      state="idle"
    />

  }

  <div class="message-bubble">

    <p>
      {{ message.text }}
    </p>

    @if (
      message.role === 'assistant' &&
      message.sources &&
      message.sources.length > 0
    ) {

      <app-source-list
        [sources]="message.sources"
      />

    }

  </div>

</div>
