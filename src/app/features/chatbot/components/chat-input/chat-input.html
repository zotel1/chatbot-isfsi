<form
  class="chat-input-form"
  (ngSubmit)="submitMessage()"
>

  <textarea
    [(ngModel)]="message"
    name="message"
    rows="1"
    [disabled]="disabled"
    [placeholder]="
      disabled
        ? 'Procesando consulta...'
        : 'Escribí tu consulta...'
    "
    aria-label="Escribí tu consulta"
  ></textarea>

  <button
    type="submit"
    [disabled]="
      disabled ||
      !message.trim()
    "
  >

    @if (disabled) {
      Consultando...
    } @else {
      Enviar
    }

  </button>

</form>
