<form
  class="chat-input-form"
  (ngSubmit)="submitMessage()"
>

  <textarea
    [(ngModel)]="message"
    name="message"
    rows="1"
    placeholder="Escribí tu consulta..."
    aria-label="Escribí tu consulta"
  ></textarea>

  <button
    type="submit"
    [disabled]="!message.trim()"
  >
    Enviar
  </button>

</form>
